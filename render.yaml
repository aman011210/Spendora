services:
  - type: web
    name: spendora-portfolio-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spendora-portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://spendora-portfolio-web.onrender.com
      - key: DEMO_USER_USERNAME
        value: rehaan
      - key: DEMO_USER_FULL_NAME
        value: Rehaan
      - key: DEMO_USER_PREVIOUS_USERNAME
        value: andrew
      - key: DEMO_USER_PASSWORD
        value: Rehaan1234

  - type: web
    name: spendora-portfolio-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://spendora-lp20.onrender.com/api
      - key: VITE_DEMO_USERNAME
        value: Rehaan
      - key: VITE_DEMO_PASSWORD
        value: Rehaan1234
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: spendora-portfolio-db
    databaseName: spendora
    user: spendora
    plan: basic-256mb
    region: oregon
    ipAllowList: []
